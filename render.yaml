services:
  - type: web
    name: financial-report-review-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      # Embedded agent chat (dashboard "Ask Agent" drawer). Values are set in the Render dashboard.
      - key: WXO_PRIVATE_KEY
        sync: false
      - key: IBM_PUBLIC_KEY      # optional: only needed to pass an SSO token
        sync: false
      - key: WXO_ORCHESTRATION_ID
        sync: false
      - key: WXO_HOST_URL
        sync: false
      - key: WXO_CRN
        sync: false
      - key: WXO_AGENT_ID
        sync: false
      - key: WXO_AGENT_ENV_ID   # optional: only if your embed snippet includes agentEnvironmentId
        sync: false
      # Mailgun inbound webhook signing key (verifies inbound email authenticity)
      - key: MAILGUN_SIGNING_KEY
        sync: false
      # ── Outbound notifications (Pending Second Signature) ─────────────────
      # Email via Mailgun — set all three to enable email notifications.
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: NOTIFICATION_EMAIL_TO
        sync: false   # comma-separated; e.g. cfo@example.com,vp-finance@example.com
      # Slack Incoming Webhook — set to enable Slack notifications.
      - key: SLACK_WEBHOOK_URL
        sync: false
    healthCheckPath: /healthz
